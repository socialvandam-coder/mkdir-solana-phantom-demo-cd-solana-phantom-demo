# Bouwt de zelfstandige Weerbot.app voor macOS (Apple Silicon) en zet hem als
# download klaar onder Actions > build-mac > Artifacts > Weerbot-standalone-mac.
name: build-mac

# Only on demand (Actions > build-mac > Run workflow) or for a release tag, so routine
# pushes don't use macOS runner minutes.
on:
  workflow_dispatch:
  push:
    tags:
      - 'weerbot-v*'

permissions:
  contents: read

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: polymarket-weather-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: polymarket-weather-bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Check shell scripts
        run: |
          for f in mac/*.sh "mac/Start Weerbot.command"; do
            bash -n "$f"
          done

      - name: Build standalone app
        env:
          PYTHON: python
        run: bash mac/build_standalone.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Weerbot-standalone-mac
          path: polymarket-weather-bot/dist/Weerbot-standalone-mac.zip
          if-no-files-found: error
          # Maximum zonder extra instellingen; daarna opnieuw bouwen (zie mac/README-mac.md).
          retention-days: 90
