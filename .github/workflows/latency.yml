# Races the free METAR sources against each other to find the fastest one.
name: latency-race

on:
  push:
    paths:
      - '.github/requests/latency.env'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: polymarket-weather-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests tzdata
      - name: Race
        run: python tools/latency_race.py --minutes 40
