<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | SocialVolgers</title>
  <meta name="description" content="Vraag over je bestelling? Neem contact op met SocialVolgers.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <h1>Contact</h1>
      <p class="muted">Heb je een vraag over een bestelling of onze diensten? Stuur ons een bericht.</p>
    </div>
    <div class="contact-layout">
      <form id="contact-form" class="card form">
        <div class="field">
          <label for="name">Naam</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">E-mailadres</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="order">Bestelnummer (optioneel)</label>
          <input id="order" name="order" type="text">
        </div>
        <div class="field">
          <label for="message">Bericht</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn">Verstuur bericht</button>
      </form>
      <aside class="card">
        <h2 style="font-size:1.2rem">Direct mailen</h2>
        <p><a data-email href="#"></a></p>
        <p class="muted">We reageren op werkdagen meestal binnen 24 uur.</p>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
